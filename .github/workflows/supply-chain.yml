# Supply-chain verification.
#
# pnpm-workspace.yaml deliberately leaves `trustPolicy: no-downgrade` off, so
# the trust check runs in CI instead. `pnpm audit signatures` verifies every
# installed package's tarball against the signature the registry published for
# it. A tampered or unsigned package fails the job.
#
# The release-age half of the hardening is `minimumReleaseAge` in
# pnpm-workspace.yaml, plus the matching cooldown in .github/dependabot.yml.

name: Supply chain

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, matching the cadence of the ESLint workflow. Catches a package
    # that is revoked or re-signed after it was already in the lockfile.
    - cron: "25 23 * * 5"

permissions:
  contents: read

jobs:
  verify:
    name: Verify dependency signatures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      # A frozen install uses exactly pnpm-lock.yaml, so this verifies the
      # exact tree a build would use rather than a fresh resolution.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures
        run: pnpm audit signatures

      # Known advisories. Scoped to high and above so a low-severity transitive
      # advisory does not block every pull request.
      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level=high
