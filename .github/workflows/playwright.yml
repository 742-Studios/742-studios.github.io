name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  # The container below must carry the exact browser builds that the installed
  # @playwright/test expects, or every test fails at browser launch. A
  # hard-coded image tag drifts the moment a Dependabot bump moves the
  # lockfile, so read the version the lockfile actually resolved instead.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Read @playwright/test version from pnpm-lock.yaml
      id: lockfile
      run: |
        version=$(grep -m1 -oE "^  '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
        if [ -z "$version" ]; then
          echo "::error::Could not find @playwright/test in pnpm-lock.yaml"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
  test:
    needs: playwright-version
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Run inside Playwright's official image: browsers and all OS dependencies
    # are prebaked, so there is no `playwright install --with-deps` apt step to
    # hang on. The tag follows the locked @playwright/test version (see above).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_SITE_META_DESCRIPTION: ${{ vars.NEXT_PUBLIC_SITE_META_DESCRIPTION }}
      # Polar checkout link for the "Get NextStarter Pro" CTA. Kept as a repo
      # variable (Settings → Secrets and variables → Actions → Variables) rather
      # than hardcoded, so the link can change without a commit and forks of this
      # starter aren't pinned to someone else's storefront. When it is unset the
      # CTA assertion skips; when set, CI proves the button really points at it.
      NEXT_PUBLIC_PRO_URL: ${{ vars.NEXT_PUBLIC_PRO_URL }}
      # Matches nextjs.yml, so the tests build /privacy with the same contact
      # section the deployed site has.
      NEXT_PUBLIC_PRIVACY_EMAIL: ${{ vars.NEXT_PUBLIC_PRIVACY_EMAIL }}
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build Next.js app
      run: pnpm build
    - name: Run Playwright tests
      run: pnpm exec playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
